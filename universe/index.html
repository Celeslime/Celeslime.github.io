	<script>
		/* 暗色模式防闪烁 + js 可用标记 + 清除残留 hash（避免刷新自动滚到锚点） */
		(function(){
			document.documentElement.classList.add("js");
			try{
				if(location.hash){
					history.replaceState(null, "", location.pathname + location.search);
				}
				if("scrollRestoration" in history){
					history.scrollRestoration = "manual";
				}
			}catch(e){}
			try{
				var t = localStorage.getItem("theme");
				if(t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)){
					document.documentElement.classList.add("dark");
				}
			}catch(e){}
		})();
	</script>
</head>
<body id="top">

	<nav class="nav">
		<a class="nav-logo" href="../" title="主页">
			<img src="../images/flower.p.min.svg" alt="Cele 的小站">
			<span>Universe</span>
		</a>
		<div class="nav-links">
			<a href="../">主页</a>
			<a href="https://github.com/Celeslime" target="_blank" rel="noopener">GitHub</a>
		</div>
	</nav>

	<header class="hero">
		<div class="hero-inner">
			<h1 id="name">星球模拟 · Universe</h1>
			<p id="slogan">万有引力下的星球运动模拟</p>
		</div>
	</header>

	<main class="container">

		<section class="card-section">
			<div class="section-head">
				<h2 class="section-title">🪐 模拟画布</h2>
				<p class="section-sub">点击画布任意位置添加一颗星球，观察它在万有引力下的运动</p>
			</div>
			<div id="stage">
				<div id="toolbox">
					<p id="mes">点击画布任意位置添加星球</p>
				</div>
				<div id="universe">
					<!-- 中心天体 -->
					<div id="center" class="planet"></div>
					<!-- 将在这里构建星球 -->
				</div>
			</div>
		</section>

		<section class="card-section">
			<div class="section-head">
				<h2 class="section-title">📖 玩法</h2>
				<p class="section-sub">简单上手，随便玩玩</p>
			</div>
			<div class="grid">
				<div class="tile">
					<div class="tile-top">
						<span class="tile-icon">🖱️</span>
						<span class="badge ok">操作</span>
					</div>
					<span class="tile_name">点击添加星球</span>
					<p class="tile_desc">在画布任意位置点击，就会生成一颗随机轨道速度的星球</p>
				</div>
				<div class="tile">
					<div class="tile-top">
						<span class="tile-icon">⚖️</span>
						<span class="badge ok">物理</span>
					</div>
					<span class="tile_name">万有引力模拟</span>
					<p class="tile_desc">星球受中心天体引力牵引，速度不足会坠入，恰好则形成轨道</p>
				</div>
				<div class="tile">
					<div class="tile-top">
						<span class="tile-icon">💥</span>
						<span class="badge toy">彩蛋</span>
					</div>
					<span class="tile_name">碰撞警告</span>
					<p class="tile_desc">星球撞上中心天体时会有提示，它也会停止运动</p>
				</div>
			</div>
		</section>

	</main>
