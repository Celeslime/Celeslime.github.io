<?xml version="1.0" encoding="UTF-8"?>
<!--
  avatar.svg：按昵称生成花头像的 SVG 入口（无内置图像；固定水印"© 2026 鸿"）。
  两种接入方式：
  ① iframe（简单，推荐）——
    <iframe src="https://celeslime.github.io/flower/avatar.svg?name=Alice" width="128" height="128" style="border:0" scrolling="no"></iframe>
  ② JS（宿主页，留言板同款）——
    <script src="flower/js/flower.js"></script>
    <script>document.querySelector('#avatar').innerHTML = FlowerGen.generateAvatar('Alice');</script>
  注意：<img src="avatar.svg"> 引用时内嵌脚本不执行，不会渲染任何图形（仅右下角水印），
  因此不能当作 <img> 头像直接使用。
  参数仅在 iframe / object / 直接访问时生效：size=128  grid=1  color=%23ff0000  bg=  petals=7  rotation=45  fillopacity=0.25  res=90
  注意：水印固定为"© 2026 鸿"、射线固定为花瓣数的 2 倍，不接受参数覆盖。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
<text x="121.6" y="121.6" font-family="Arial, sans-serif" font-size="1.92" fill="#46d2d0" fill-opacity="0.5" text-anchor="end" dominant-baseline="auto">© 2026 鸿</text><!-- 头像生成来源：https://celeslime.github.io/ -->
<script type="text/javascript" href="js/flower.js"></script>
<script type="text/javascript" href="js/avatar-run.js"></script>
</svg>
