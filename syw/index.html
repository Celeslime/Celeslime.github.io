<!DOCTYPE html>
<html lang="zh-cn">
<head>
	<title>原神面板计算器 · Genshin Calculator | CeleSlime</title>
	<meta name="description" content="原神角色面板与伤害计算器：输入基础攻击力、攻击力加成、暴击率、暴击伤害、元素精通与伤害加成，一键算出期望面板与伤害数值。">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width" initial-scale="1"/>
	<script>
		/* 暗色模式跟随系统/已存主题（与主页一致） */
		(function(){
			try{
				var t = localStorage.getItem("theme");
				if(t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)){
					document.documentElement.classList.add("dark");
				}
			}catch(e){}
		})();
	</script>
	<link rel="stylesheet" type="text/css" href="../css/base.css">
	<link rel="stylesheet" type="text/css" href="../css/nav.css">
	<link rel="stylesheet" type="text/css" href="../css/hero.css">
	<link rel="stylesheet" type="text/css" href="../css/responsive.css">
	<link rel="stylesheet" type="text/css" href="css/style.css">
	<link rel="icon" href="icon.png" sizes="32x32">
</head>
<body>
	<nav class="nav">
		<a class="nav-logo" href="../" title="主页">
			<img src="icon.png" alt="Cele">
			<span>Cele</span>
		</a>
		<div class="nav-links">
			<a href="../" rel="noopener">主页</a>
			<a href="https://github.com/Celeslime" target="_blank" rel="noopener">GitHub</a>
		</div>
	</nav>

	<header class="hero">
		<div class="hero-inner">
			<h1 id="name">原神：面板计算器</h1>
			<p id="slogan">拉格朗日方程 · 早期算法探索</p>
		</div>
	</header>

	<main class="container">
		<div class="syw-card">
			<form name="attr">
				<label>基础攻击力(白值) ATK.Base
					<input type="number" name="atkBase" value="848">
				</label>
				<label>+攻击力增加(绿值) ATK.Addition
					<input type="number" name="atkAdd" value="1024">
				</label>
				<label>暴击率 CRIT.Rate(%)
					<input type="number" name="critRate" value="79.3">
				</label>
				<label>暴击伤害 CRIT.DMG(%)
					<input type="number" name="critDmg" value="179.8">
				</label>
				<label>元素精通 Elemental Mastery
					<input type="number" name="elemMastery" value="169">
				</label>
<!-- 				<label>伤害加成 DMG(%)
					<input type="number" name="dmg" value="46.6">
				</label> -->
			</form>
			<button class="syw-btn" onclick="onKeyUp()">计算 Calc</button>
			<div id="ans">
				<div id="sc"></div>
				<div id="ex"></div>
				<div id="he">
					<div id="hel1"></div>
					<div id="hel"></div>
				</div>
			</div>
		</div>
	</main>
	<script type="text/javascript" src="js/main.js"></script>
</body>
</html>
